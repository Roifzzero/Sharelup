name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak proyek
        run: unzip -q Sharelup-project.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Buat kunci tanda tangan
        working-directory: proj
        run: keytool -genkeypair -keystore app/release.jks -alias sharelup -keyalg RSA -keysize 2048 -validity 10000 -storepass sharelup123 -keypass sharelup123 -dname "CN=Sharelup, C=ID"
      - name: Bangun APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon
      - name: Siapkan APK
        run: cp proj/app/build/outputs/apk/release/app-release.apk Sharelup.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sharelup v${{ github.run_number }}
          files: Sharelup.apk
